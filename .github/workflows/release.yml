name: Release (reusable)

# Signed, notarized macOS app release. Call from the app repo's release
# workflow, which owns the triggers (workflow_dispatch and/or v* tag push):
#
#   jobs:
#     release:
#       uses: d0g4sale/macos-release-workflows/.github/workflows/release.yml@v1
#       with:
#         bump: ${{ inputs.bump || 'auto' }}
#         prerelease: ${{ inputs.prerelease == true }}
#       secrets: { BUILD_CERTIFICATE_BASE64: ..., ... }   # see README
#
#   * workflow_dispatch: computes the next version from tags ("auto" reads
#     Conventional Commits since the last tag: feat -> minor, `!`/BREAKING
#     CHANGE -> major, else patch). The tag is created only after the build is
#     tested, signed and notarized, so a failed run leaves no tag.
#   * push of a vX.Y.Z tag: releases exactly that tag.
#
# Publishes a GitHub Release with:
#   <ARTIFACT_NAME>-<version>.dmg   notarized + stapled disk image
#   <ARTIFACT_NAME>-<version>.zip   notarized + stapled .app (ditto)
#   SHA256SUMS.txt
#
# Reads per-app settings from the CALLER's .github/build.env (see README).
# The caller must grant `permissions: contents: write`.
on:
  workflow_call:
    inputs:
      bump:
        description: "auto | patch | minor | major (manual runs only)"
        required: false
        type: string
        default: auto
      prerelease:
        description: "Mark the release as a pre-release (manual runs only)"
        required: false
        type: boolean
        default: false
    secrets:
      BUILD_CERTIFICATE_BASE64:
        required: false   # checked with a clear error in the release job
      P12_PASSWORD:
        required: false   # checked with a clear error in the release job
      KEYCHAIN_PASSWORD:
        required: false   # checked with a clear error in the release job
      NOTARY_KEY_BASE64:
        required: false   # checked with a clear error in the release job
      NOTARY_KEY_ID:
        required: false   # checked with a clear error in the release job
      NOTARY_ISSUER_ID:
        required: false   # checked with a clear error in the release job

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     # full history + tags for version calculation

      - name: Determine version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || '' }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "push" ]; then
            # Tag push: release exactly that tag.
            tag="$REF_NAME"
            version="${tag#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag $tag is not vX.Y.Z"
              exit 1
            fi
            sha="$(git rev-list -n1 "$tag")"
            echo "Releasing pushed tag $tag ($sha)"
          else
            # Latest semver tag, accepting both "1.2.3" and "v1.2.3".
            last_version=$(git tag --list | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1 || true)

            if [ -z "$last_version" ]; then
              last_tag=""
              last_version="0.0.0"
              range="HEAD"
            else
              if git rev-parse -q --verify "refs/tags/v${last_version}" >/dev/null; then
                last_tag="v${last_version}"
              else
                last_tag="${last_version}"
              fi
              range="${last_tag}..HEAD"
            fi

            if [ -z "$(git rev-list "$range")" ]; then
              echo "::error::No commits since ${last_tag:-the start of history}; nothing to release."
              exit 1
            fi

            if [ "$BUMP" = "auto" ]; then
              subjects=$(git log --format=%s "$range")
              bodies=$(git log --format=%b "$range")
              if grep -qE '^[a-z]+(\([^)]*\))?!:' <<<"$subjects" || grep -q 'BREAKING CHANGE' <<<"$bodies"; then
                BUMP="major"
              elif grep -qE '^feat(\([^)]*\))?:' <<<"$subjects"; then
                BUMP="minor"
              else
                BUMP="patch"
              fi
            fi

            IFS=. read -r major minor patch <<< "$last_version"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) echo "::error::Unknown bump: $BUMP"; exit 1 ;;
            esac
            version="${major}.${minor}.${patch}"
            tag="v${version}"

            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "::error::Tag ${tag} already exists."
              exit 1
            fi
            sha="$(git rev-parse HEAD)"
            echo "Last release: ${last_tag:-none}  ->  ${tag} (${BUMP} bump)"
          fi

          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "sha=${sha}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Releasing ${tag}"
            echo "Commit: \`${sha}\` · Trigger: **${EVENT}**${BUMP:+ · Bump: **${BUMP}**}"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: version
    runs-on: macos-26
    permissions:
      contents: write     # create the release and attach assets
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      SHA: ${{ needs.version.outputs.sha }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      # Fail fast with a clear message instead of an opaque PKCS12/notary error
      # after the tests have already run.
      - name: Check signing secrets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          missing=()
          for name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD KEYCHAIN_PASSWORD \
                      NOTARY_KEY_BASE64 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Load build config
        run: |
          grep -Ev '^[[:space:]]*(#|$)' .github/build.env >> "$GITHUB_ENV"
          {
            echo "DIST=$RUNNER_TEMP/dist"
            echo "ARCHIVE=$RUNNER_TEMP/app.xcarchive"
            echo "EXPORT_DIR=$RUNNER_TEMP/export"
          } >> "$GITHUB_ENV"

      # Use the newest stable Xcode the runner image ships. This auto-tracks
      # runner updates instead of pinning a version that may not be installed.
      # The project's deployment target must be <= the SDK this Xcode provides.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install tools
        run: |
          # The runner image pre-taps aws/tap, which newer Homebrew flags as
          # untrusted and warns about on every invocation. Untap it (tolerating
          # its absence on future images) to keep logs clean.
          brew untap aws/tap 2>/dev/null || true
          brew install create-dmg
          if [ "${XCODEGEN:-false}" = "true" ]; then brew install xcodegen; fi

      # Only for repos whose .xcodeproj is generated from project.yml.
      - name: Generate Xcode project
        if: env.XCODEGEN == 'true'
        run: xcodegen generate

      # --- Gate the release on the unit tests: don't sign/notarize a bad build ---
      - name: Run unit tests
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=macOS' \
            -only-testing:"$UNIT_TEST_TARGET" \
            CODE_SIGNING_ALLOWED=NO

      # --- Import the Developer ID signing certificate into a throwaway keychain ---
      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          # Allow codesign to use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Make the keychain visible to the build tools.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$CERT_PATH"

      # --- Archive with Developer ID signing ---
      # Stamp the release version into the bundle: the project hardcodes
      # MARKETING_VERSION=1.0, so override it with the tag's version and use
      # the CI run number as the build number.
      - name: Archive
        run: |
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$ARCHIVE" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp"

      # --- Export the signed .app (Developer ID distribution) ---
      - name: Export .app
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>developer-id</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Developer ID Application</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      # The exported bundle is named after PRODUCT_NAME (e.g. "AWS Sessions.app"),
      # which can differ from the scheme. Discover it so a product rename never
      # breaks packaging, and check the version actually got stamped.
      - name: Verify app
        run: |
          APP_PATH="$(find "$EXPORT_DIR" -maxdepth 1 -name '*.app' | head -1)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app found in $EXPORT_DIR"
            ls -la "$EXPORT_DIR" >&2 || true
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          plist="$APP_PATH/Contents/Info.plist"
          short=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$plist")
          build=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$plist")
          echo "$(basename "$APP_PATH"): $short ($build)"
          if [ "$short" != "$VERSION" ] || [ "$build" != "$BUILD_NUMBER" ]; then
            echo "::error::App reports $short ($build), expected $VERSION ($BUILD_NUMBER)"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Prepare notarization
        env:
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$NOTARY_KEY_BASE64" | base64 --decode -o "$RUNNER_TEMP/notary.p8"
          # notarize.sh <file>: submit, wait, and fail (printing Apple's log)
          # unless the submission is Accepted.
          cat > "$RUNNER_TEMP/notarize.sh" <<EOF
          #!/bin/bash
          set -euo pipefail
          rc=0
          out=\$(xcrun notarytool submit "\$1" \\
            --key "$RUNNER_TEMP/notary.p8" \\
            --key-id "$NOTARY_KEY_ID" \\
            --issuer "$NOTARY_ISSUER_ID" \\
            --wait --output-format json) || rc=\$?
          echo "\$out"
          status=\$(/usr/bin/plutil -extract status raw -o - - <<<"\$out" 2>/dev/null || echo unknown)
          if [ "\$rc" -ne 0 ] || [ "\$status" != "Accepted" ]; then
            id=\$(/usr/bin/plutil -extract id raw -o - - <<<"\$out" 2>/dev/null || true)
            [ -n "\$id" ] && xcrun notarytool log "\$id" \\
              --key "$RUNNER_TEMP/notary.p8" \\
              --key-id "$NOTARY_KEY_ID" \\
              --issuer "$NOTARY_ISSUER_ID" || true
            echo "::error::Notarization of \$(basename "\$1") failed (exit \$rc, status \$status)"
            exit 1
          fi
          EOF
          chmod +x "$RUNNER_TEMP/notarize.sh"
          mkdir -p "$DIST"

      # --- Notarize + staple the .app, then zip the stapled app ---
      - name: Notarize app & package .zip
        run: |
          ZIP="$DIST/$ARTIFACT_NAME-$VERSION.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$RUNNER_TEMP/notarize-app.zip"
          "$RUNNER_TEMP/notarize.sh" "$RUNNER_TEMP/notarize-app.zip"
          xcrun stapler staple "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP"

      # --- Package the stapled app into a .dmg, sign, notarize, staple ---
      - name: Package, notarize & staple .dmg
        run: |
          DMG="$DIST/$ARTIFACT_NAME-$VERSION.dmg"
          APP_BUNDLE="$(basename "$APP_PATH")"
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          cp -R "$APP_PATH" "$STAGE/"

          args=(
            --volname "$APP_DISPLAY_NAME"
            --window-pos 200 120
            --window-size 600 600
            --icon-size 100
            --icon "$APP_BUNDLE" 140 300
            --hide-extension "$APP_BUNDLE"
            --app-drop-link 460 300
          )
          # Optional per-repo DMG background and volume icon.
          if [ -f .github/assets/dmg_background.png ]; then
            args+=(--background .github/assets/dmg_background.png)
          fi
          if [ -f "$APP_PATH/Contents/Resources/AppIcon.icns" ]; then
            args+=(--volicon "$APP_PATH/Contents/Resources/AppIcon.icns")
          fi
          create-dmg "${args[@]}" "$DMG" "$STAGE"

          codesign --sign "Developer ID Application" --timestamp "$DMG"
          "$RUNNER_TEMP/notarize.sh" "$DMG"
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose "$DMG"

      - name: Generate checksums
        working-directory: ${{ env.DIST }}
        run: |
          shasum -a 256 -- *.dmg *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}-${{ needs.version.outputs.version }}
          path: ${{ env.DIST }}/*

      # Creates the tag at $SHA (manual runs) or uses the pushed tag, with
      # auto-generated notes. Re-running a release replaces its assets.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber "$DIST"/*
            gh release edit "$TAG" --prerelease="$PRERELEASE"
          else
            flags=()
            if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
            gh release create "$TAG" \
              --target "$SHA" \
              --title "$APP_DISPLAY_NAME $TAG" \
              --generate-notes \
              "${flags[@]}" \
              "$DIST"/*
          fi

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8"
